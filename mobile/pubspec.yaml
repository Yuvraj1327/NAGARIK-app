name: nagarik
description: "NAGARIK — A Civic Good Initiative. Citizen civic issue reporting app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # -- Supabase Auth (Flutter talks to Supabase Auth directly; see
  #    docs/ARCHITECTURE.md for the full auth-token flow decision) --
  supabase_flutter: ^2.8.0

  # -- HTTP client for talking to the FastAPI backend --
  dio: ^5.7.0

  # -- State management --
  flutter_riverpod: ^2.6.1

  # -- Navigation --
  go_router: ^14.6.2

  # -- Environment configuration (loads mobile/.env at runtime) --
  flutter_dotenv: ^5.2.1

  # -- Value equality for simple domain models, avoids boilerplate --
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8

  # -- Step 6: real device location for report coordinates --
  geolocator: ^13.0.1

  # -- Step 6: real image picking (gallery + camera) for report photos --
  image_picker: ^1.1.2

  # -- Step 7: caches report photos fetched from signed Storage URLs, so the
  #    feed/search/detail screens don't re-download the same image on every
  #    scroll or rebuild --
  cached_network_image: ^3.4.1

  # -- Profile & Settings upgrade: persists the user's theme preference
  #    (System Default / Light / Dark) across app restarts. The official
  #    Flutter-team package for small key-value settings like this. --
  shared_preferences: ^2.3.3

  # -- Location Discovery & Home upgrade: the Nearby/Discovery map view. --
  # `flutter_map` renders OpenStreetMap tiles with no API key and no native
  # platform setup (unlike `google_maps_flutter`, which needs a billing-
  # enabled Google Cloud API key configured per-platform) — the simplest
  # real map for this step's "show real report coordinates on a map"
  # requirement. `latlong2` is its required companion for the `LatLng`
  # type; both are maintained by the flutter_map project.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # -- Location Discovery & Home upgrade: turns the device's current
  #    coordinates into a readable place name ("Bhopal") for the Home
  #    screen's location indicator. From the same maintainers as
  #    `geolocator` (Baseflow) and, like it, wraps the OS's own geocoder
  #    (Android `Geocoder` / iOS `CLGeocoder`) — no API key, no new backend
  #    call, and it's the standard package for exactly this one job. --
  geocoding: ^3.0.0

  # -- Report Sharing, Saved Reports & Final Feature Polish: the platform's
  #    native share sheet (Android/iOS share sheet, macOS/Web share where
  #    supported), for Report Detail's "Share" action. The standard
  #    Flutter-team-recommended package for exactly this; pinned to the 7.x
  #    line for its simple, stable `Share.share(text)` static API. --
  share_plus: ^7.2.2

  # -- NAGARIK Theme upgrade: "Continue with Google" on the new Auth
  #    Welcome screen. Drives the platform's own native account picker,
  #    then hands the resulting Google ID token to Supabase Auth
  #    (`signInWithIdToken` — see AuthRepository.signInWithGoogle) rather
  #    than Supabase's web-redirect OAuth flow, which would show an in-app
  #    browser instead of the real native picker the brief calls for. The
  #    official Google-maintained Flutter package for exactly this. --
  google_sign_in: ^6.2.1

  # -- Report Issue redesign: Google Maps for the new "Place" step's
  #    location picker, per explicit request. This is a SEPARATE mapping
  #    technology from `flutter_map` above, which Search/Nearby keeps using
  #    unchanged — `flutter_map`'s own comment explains it was chosen
  #    specifically to avoid exactly what this package needs: a billing-
  #    enabled Google Cloud Maps API key, configured natively per platform
  #    (Android `AndroidManifest.xml` meta-data, iOS `AppDelegate.swift`).
  #    This project has no native android/ios folders yet (see
  #    mobile/README.md), so that native wiring can't be done from here —
  #    see mobile/README.md's new "Google Maps setup" section for the exact
  #    one-time steps once this project has been through `flutter create`.
  google_maps_flutter: ^2.9.0

  # -- Onboarding redesign: Step 6 ("Permissions") needs to show a real
  #    Location/Camera permission prompt with a rationale, continuing
  #    either way, WITHOUT that prompt immediately doing anything invasive
  #    (fetching a GPS fix, opening the camera UI). Neither existing
  #    location/camera package offers that: `geolocator` only requests
  #    permission as a side effect of actually fetching a position
  #    (`LocationService.getCurrentPosition`), and `image_picker` only
  #    requests camera/photo-library permission as a side effect of
  #    actually opening the camera/gallery picker — both would be
  #    disruptive triggered from onboarding just to show a permission
  #    prompt. `permission_handler` is the standard, Flutter-team-
  #    recommended package for exactly "ask for this permission on its
  #    own"; it reads the same manifest/Info.plist declarations
  #    `geolocator`/`image_picker` already need (see "Native permissions"
  #    in mobile/README.md), so no new native permission strings are
  #    required, only (on iOS, once this project has a real `ios/` folder)
  #    the small Podfile macro mobile/README.md's new section documents.
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # -- Official Logo upgrade: generates each platform's app icon from the
  #    same nagarik_logo.png everything else uses (see the
  #    `flutter_launcher_icons:` config below). NOTE: this repository has
  #    never been through `flutter create`, so it has no android/, ios/,
  #    web/, or macos/ folders yet for a generator to write icons into —
  #    running this tool only does something once those exist. See
  #    mobile/README.md's "App icons" section for the one-time steps.
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - .env
    # Official Logo upgrade: the one, exact NAGARIK logo file — see
    # lib/shared/widgets/logo.dart, the single reusable widget every screen
    # uses to display it.
    - assets/images/nagarik_logo.png
    # NAGARIK Theme upgrade: category photos (Home → Explore by Category
    # and Report Issue → Category selection — see ReportCategory.imagePath
    # in core/constants/report_category.dart) and the Login/Signup hero
    # banner image.
    - assets/images/category_road.jpg
    - assets/images/category_streetlight.jpg
    - assets/images/category_sanitation.jpg
    - assets/images/category_water.jpg
    - assets/images/category_electricity.jpg
    - assets/images/category_safety.jpg
    - assets/images/auth_hero.jpg

# Official Logo upgrade: `dart run flutter_launcher_icons` reads this
# top-level section (it's flutter_launcher_icons' own config block, not
# part of Flutter's `flutter:` section above) and writes the generated
# icon files straight into each platform folder it finds. Every platform
# below points at the same, single source file as `Logo` (the in-app
# widget) does, so the launcher icon and the in-app logo are always the
# same artwork.
flutter_launcher_icons:
  image_path: "assets/images/nagarik_logo.png"
  android: true
  ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/nagarik_logo.png"
  macos:
    generate: true
    image_path: "assets/images/nagarik_logo.png"
  windows:
    generate: true
    image_path: "assets/images/nagarik_logo.png"
